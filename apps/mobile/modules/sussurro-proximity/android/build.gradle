plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sussurro.proximity'
version = '0.1.0'

android {
  namespace "expo.modules.sussurroproximity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

android {
  // Testes de JVM do protocolo NFC (SussurroNfcProtocolTest): o android.jar de teste devolve
  // valores padrão (SystemClock = 0) em vez de lançar "Stub!".
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
