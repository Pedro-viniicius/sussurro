include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Filas e DLQs criadas na subida (infra.md §3.2). Consumidores a partir da Fase 2.
queues {
  media-jobs {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "media-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  media-jobs-dlq {}
  video-events {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "video-events-dlq"
      maxReceiveCount = 3
    }
  }
  video-events-dlq {}
  push {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "push-dlq"
      maxReceiveCount = 3
    }
  }
  push-dlq {}
}
