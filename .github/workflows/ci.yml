# CI (infra.md §4.1; testes.md §3.5 e §10.7, casos F0-CI-01 a F0-CI-05). Desde a Fase 7, também as
# imagens de produção em ARM64 (job "images") e o lock dos providers do Terraform (job "infra").
# Actions fixadas por SHA (a tag fica no comentário); o Dependabot propõe as atualizações.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Auditoria semanal de dependências (segunda, 06:00 UTC). Só o job "audit" roda nesse gatilho.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # O evento entra no grupo para o agendamento não cancelar um push pendente na main (e vice-versa).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  secrets:
    name: secrets (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # O token não fica no .git/config, que é montado no container abaixo.
          persist-credentials: false
      # CLI do gitleaks (MIT) em vez da gitleaks-action, que exige licença em organizações.
      # Imagem fixada por digest: é ela que lê todo o histórico do repositório.
      - name: gitleaks (histórico completo)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config .gitleaks.toml --redact --verbose --no-banner .

  quality:
    name: quality (lint, typecheck, format)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sem o input "version": lê o packageManager (pnpm@12.13.0) do package.json. Sem corepack.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # B8: as exceções do audit (audit.ignore) só valem no caminho registrado e até a data de
      # revisão. Aqui roda em todo PR e bloqueia o merge (infra.md §8.3); sem rede, só o lockfile.
      - name: Exceções do audit (caminho registrado e data de revisão)
        run: node scripts/audit-exceptions.mjs
      # Paridade (B5): o Dependabot atualiza a tag e o digest das imagens do docker-compose.yml,
      # mas não as dos services deste workflow. Aqui, toda imagem de service precisa ser
      # exatamente uma do compose.
      - name: Imagens dos services iguais às do docker-compose.yml
        run: |
          compose=$(sed -nE 's/^[[:space:]]+image:[[:space:]]*([^[:space:]#]+).*/\1/p' docker-compose.yml | sort -u)
          servicos=$(sed -nE 's/^[[:space:]]+image:[[:space:]]*([^[:space:]#]+).*/\1/p' .github/workflows/ci.yml | sort -u)
          echo "$servicos"
          test -n "$servicos" -a -n "$compose"
          fora=$(comm -13 <(echo "$compose") <(echo "$servicos"))
          if [ -n "$fora" ]; then
            echo "::error file=.github/workflows/ci.yml::imagem de service diferente do docker-compose.yml: $fora"
            exit 1
          fi
      - name: Título do PR em Conventional Commits (vira a mensagem do squash merge)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck
      - name: expo-doctor (informativo na Fase 0)
        continue-on-error: true
        run: pnpm --filter @sussurro/mobile exec expo-doctor

  test:
    name: test (unitários + e2e com Postgres e Valkey)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      # Mesmas imagens, tags e digests do docker-compose.yml (paridade com o ambiente local; o job
      # "quality" confere). Digest do índice multi-arquitetura: vale no x64 e no ARM64.
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_USER: sussurro
          POSTGRES_PASSWORD: sussurro
          POSTGRES_DB: sussurro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sussurro -d sussurro"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Credencial descartável do container de teste (a mesma do .env.example), não é segredo.
      # O turbo só repassa ao test:e2e as variáveis listadas em turbo.json → tasks.test:e2e.env.
      DATABASE_URL: postgres://sussurro:sussurro@localhost:5432/sussurro
      REDIS_URL: redis://localhost:6379
      TZ: UTC
      # Fase 2: emuladores S3/SQS do compose (credencial local de infra/local/s3.json).
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_S3: http://localhost:8333
      AWS_ENDPOINT_URL_SQS: http://localhost:9324
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_MEDIA: sussurro-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Unitários (shared, db, api, worker, ui, mobile)
        run: pnpm test
      # Fase 1 (A-24): o drizzle-kit aplica as migrations no banco do service. Os testes criam
      # bancos próprios (sussurro_test_*) com as mesmas migrations.
      - name: Migrations (drizzle-kit)
        run: pnpm db:migrate
      # Fase 2: SQS e S3 (ElasticMQ e SeaweedFS do compose, com as filas, DLQs e o bucket). Os e2e
      # que só valem com S3/SQS de verdade (Content-Length, URL vencida, DLQ) usam estes serviços.
      - name: Emuladores S3/SQS (compose)
        run: docker compose up -d --wait elasticmq seaweedfs s3-init
      - name: Integração e e2e (Postgres, Valkey, S3 e SQS reais)
        run: pnpm test:e2e

  build:
    name: build (pacotes, API e worker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # O app não tem build no turbo: os binários saem do EAS.
      - run: pnpm turbo run build --filter=!@sussurro/mobile
      - name: Confere a saída da API e do worker (F0-GATE-06)
        run: test -f apps/api/dist/main.js && test -f apps/worker/dist/main.js

  # Fase 7 (infra.md §4.2, backlog E7 CA0): validação só estática do Terraform e dos Dockerfiles.
  # Sem credencial da AWS, sem plan e sem apply. Versões fixadas: Terraform 1.16.6, TFLint v0.64.0
  # (binário conferido por SHA-256), ruleset da AWS 0.49.0 (.tflint.hcl) e Trivy 0.76.0 (imagem
  # fixada por digest). Achados aceitos ficam no próprio código, com #trivy:ignore e a justificativa.
  infra:
    name: infra (terraform fmt, validate, tflint, trivy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      # B6: com o .terraform.lock.hcl versionado, o init roda com -lockfile=readonly: não muda o lock
      # e falha se um provider não estiver nele ou se o pacote baixado não bater com o hash
      # registrado. Uma raiz sem lock no Git ainda passa (init normal) e entra na lista "sem_lock",
      # que os dois passos seguintes usam para gerar o lock e publicá-lo como artefato.
      - name: terraform init e validate (sem backend e sem credenciais)
        id: tf
        run: |
          sem_lock=""
          for dir in infra/terraform/bootstrap infra/terraform/envs/prod; do
            if [ -f "$dir/.terraform.lock.hcl" ]; then
              terraform -chdir="$dir" init -backend=false -input=false -no-color -lockfile=readonly
            else
              echo "::warning title=Terraform sem lock::$dir não tem .terraform.lock.hcl no Git; o CI gera um no artefato terraform-lock (infra/terraform/README.md, Versões)"
              terraform -chdir="$dir" init -backend=false -input=false -no-color
              sem_lock="$sem_lock $dir"
            fi
            terraform -chdir="$dir" validate -no-color
          done
          echo "sem_lock=${sem_lock# }" >> "$GITHUB_OUTPUT"
      # Só fala com o registry da HashiCorp (baixa o pacote de cada plataforma para calcular o hash):
      # não precisa de credencial da AWS. Plataformas do time (Windows, Mac Intel e Apple Silicon)
      # e do CI (Linux x64 e ARM64).
      - name: terraform providers lock (só nas raízes sem o lock no Git)
        if: steps.tf.outputs.sem_lock != ''
        env:
          SEM_LOCK: ${{ steps.tf.outputs.sem_lock }}
        run: |
          for dir in $SEM_LOCK; do
            terraform -chdir="$dir" providers lock \
              -platform=linux_amd64 -platform=linux_arm64 \
              -platform=darwin_amd64 -platform=darwin_arm64 -platform=windows_amd64
          done
      # O Tech Lead baixa o artefato e o DevOps versiona os arquivos (bootstrap/ e envs/prod/).
      - name: Publica o lock gerado (artefato terraform-lock)
        if: steps.tf.outputs.sem_lock != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-lock
          path: |
            infra/terraform/bootstrap/.terraform.lock.hcl
            infra/terraform/envs/prod/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
      - name: tflint
        working-directory: infra/terraform
        env:
          # Só para baixar o plugin da AWS sem o limite anônimo da API do GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl" --minimum-failure-severity=warning
      - name: trivy config (Terraform e Dockerfiles)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          config --exit-code 1 --severity HIGH,CRITICAL
          --skip-dirs node_modules --skip-dirs docs .

  # B5: o "images" é o job mais caro (repositório privado: os minutos contam). No PR, ele só roda
  # quando o diff mexe em algo que entra nas imagens ou no próprio CI; na main e no
  # workflow_dispatch, sempre. Caminho desconhecido conta como relevante, e se este job falhar o
  # "images" roda do mesmo jeito.
  changes:
    name: changes (o PR mexe nas imagens?)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O merge commit do PR (refs/pull/N/merge) e os pais: HEAD^1 é a ponta da main.
          fetch-depth: 2
          persist-credentials: false
      - name: Arquivos do PR que afetam as imagens e a parte nativa do app
        id: diff
        run: |
          # quotepath=off: caminho com acento sai como está, sem aspas, e casa com os padrões.
          arquivos=$(git -c core.quotepath=off diff --name-only HEAD^1 HEAD)
          images=false
          while IFS= read -r f; do
            case "$f" in
              # Fora do contexto das imagens (.dockerignore) ou sem efeito no build e no teste delas.
              infra/local/*) images=true ;;
              docs/* | infra/* | .claude/* | *.md) ;;
              apps/*/test/* | *.spec.ts | *.test.ts | *.test.tsx | */vitest*.config.ts) ;;
              apps/mobile/package.json | packages/ui/package.json) images=true ;;
              apps/mobile/* | packages/ui/*) ;;
              .github/CODEOWNERS | .github/dependabot.yml | .github/pull_request_template.md) ;;
              .gitleaks.toml | .gitleaksignore | scripts/audit-exceptions.mjs) ;;
              *) images=true ;;
            esac
          done <<< "$arquivos"
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"
          # Job "native": o módulo nativo, o que entra no prebuild do Android e o próprio job.
          native=false
          while IFS= read -r f; do
            case "$f" in
              apps/mobile/modules/* | apps/mobile/app.config.ts | apps/mobile/package.json) native=true ;;
              package.json | pnpm-lock.yaml | pnpm-workspace.yaml) native=true ;;
              scripts/check-android-manifest.mjs | .github/workflows/ci.yml) native=true ;;
            esac
          done <<< "$arquivos"
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  # B5 (7.6 CA; runbook, passo 4): as imagens de produção, construídas e testadas em ARM64 nativo,
  # a arquitetura do Fargate (Graviton). O ubuntu-24.04-arm é runner "standard" também em
  # repositório privado (GitHub, 2026-01-29): gasta a franquia do plano como o x64 e, fora dela,
  # custa US$ 0,005/min (x64: US$ 0,006). Build por QEMU num runner x64 levaria várias vezes mais
  # minutos, e um smoke em amd64 testaria uma arquitetura que não roda em produção (infra.md §4.1).
  images:
    name: images (build ARM64, usuário, migration e /health/ready)
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.images != 'false')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      # As mesmas imagens, tags e digests do docker-compose.yml, em portas do host fora das padrão (sem
      # colisão com um Postgres do próprio runner). Os containers das imagens usam --network host.
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_USER: sussurro
          POSTGRES_PASSWORD: sussurro
          POSTGRES_DB: sussurro
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U sussurro -d sussurro"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports: ['16379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Credencial descartável do container de teste (a mesma do .env.example), não é segredo.
      DATABASE_URL: postgres://sussurro:sussurro@127.0.0.1:15432/sussurro
      REDIS_URL: redis://127.0.0.1:16379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --platform explícito: num runner x64 (sem QEMU) o build falha em vez de sair amd64. O cache
      # do store do pnpm (RUN --mount=type=cache) é compartilhado entre os dois builds.
      - name: Build da imagem da API (linux/arm64)
        run: docker buildx build --platform linux/arm64 --load -f apps/api/Dockerfile -t sussurro-api:ci .
      - name: Build da imagem do worker (linux/arm64)
        run: docker buildx build --platform linux/arm64 --load -f apps/worker/Dockerfile -t sussurro-worker:ci .
      - name: Arquitetura e usuário das imagens (arm64, node, uid 1000)
        run: |
          for app in api worker; do
            img="sussurro-$app:ci"
            arch=$(docker image inspect --format '{{.Architecture}}' "$img")
            usuario=$(docker run --rm --entrypoint id "$img" -un)
            uid=$(docker run --rm --entrypoint id "$img" -u)
            echo "$img: arquitetura=$arch usuário=$usuario uid=$uid"
            test "$arch" = arm64
            test "$usuario" = node
            test "$uid" = 1000
          done
      # Runbook, passos 4 e 7: a task "migrate" do ECS roda esta imagem com `node dist/migrate.js`.
      # A segunda execução não tem nada a aplicar e também precisa sair com 0.
      - name: Migration pela imagem da API (duas vezes)
        run: |
          for vez in 1 2; do
            docker run --rm --network host --read-only --tmpfs /tmp -e DATABASE_URL \
              sussurro-api:ci node dist/migrate.js
          done
      # Como no ECS: NODE_ENV=production (o da imagem), raiz só leitura com /tmp gravável e init.
      # Os valores de produção que o boot exige são fictícios e gerados aqui; SES e CloudFront não
      # são chamados para responder ao /health/ready.
      - name: API pela imagem responde /health/ready 200 (Postgres e Valkey)
        run: |
          JWT_ACCESS_SECRET=$(openssl rand -hex 32)
          CLOUDFRONT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
          export JWT_ACCESS_SECRET CLOUDFRONT_PRIVATE_KEY
          docker run -d --name api --network host --read-only --tmpfs /tmp --init \
            -e DATABASE_URL -e REDIS_URL -e JWT_ACCESS_SECRET -e CLOUDFRONT_PRIVATE_KEY \
            -e EMAIL_SENDER=ses -e MODERATION_EMAIL=moderacao@example.com \
            -e MEDIA_URL_SIGNER=cloudfront -e CLOUDFRONT_DOMAIN=media.example.com \
            -e CLOUDFRONT_KEY_PAIR_ID=KCIFICTICIO \
            sussurro-api:ci
          status=000
          for tentativa in $(seq 1 30); do
            status=$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://127.0.0.1:3000/health/ready || true)
            [ "$status" = 200 ] && break
            sleep 2
          done
          echo "GET /health/ready -> $status $(cat "$RUNNER_TEMP/ready.json" 2>/dev/null)"
          test "$status" = 200
          grep -q '"status":"ok"' "$RUNNER_TEMP/ready.json"
      - name: Emuladores S3/SQS (compose) para o worker
        run: docker compose up -d --wait elasticmq seaweedfs s3-init
      # Também como em produção: MediaConvert (ARN fictício) e Expo, que só seriam chamados com
      # mensagem na fila. Confere a subida (o sharp ARM64 carrega no import) e a primeira
      # manutenção, 5 s depois (banco e S3).
      - name: Worker pela imagem sobe e fica no ar
        env:
          # Credencial local dos emuladores (infra/local/s3.json), não é segredo.
          AWS_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:8333
          AWS_ENDPOINT_URL_SQS: http://127.0.0.1:9324
          S3_FORCE_PATH_STYLE: 'true'
          S3_BUCKET_MEDIA: sussurro-media
        run: |
          docker run -d --name worker --network host --read-only --tmpfs /tmp --init \
            -e DATABASE_URL -e REDIS_URL -e AWS_REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_ENDPOINT_URL_S3 -e AWS_ENDPOINT_URL_SQS -e S3_FORCE_PATH_STYLE -e S3_BUCKET_MEDIA \
            -e VIDEO_PROCESSOR=mediaconvert -e MEDIACONVERT_ROLE_ARN=arn:aws:iam::123456789012:role/ci-ficticia \
            -e PUSH_SENDER=expo \
            sussurro-worker:ci
          # O log vai para uma variável antes do grep: "docker logs | grep -q" pode morrer de
          # SIGPIPE e, com pipefail, falhar à toa.
          for tentativa in $(seq 1 30); do
            logs=$(docker logs worker 2>&1)
            if grep -q 'Worker iniciado' <<< "$logs"; then break; fi
            sleep 2
          done
          sleep 10
          logs=$(docker logs worker 2>&1)
          grep 'Worker iniciado (production' <<< "$logs"
          test "$(docker inspect --format '{{.State.Running}}' worker)" = true
          if grep 'Falha na manuten' <<< "$logs"; then exit 1; fi
      # SIGTERM, como no deploy e no aviso do Spot: os dois fecham as conexões e saem com 0.
      - name: Desligamento gracioso (SIGTERM e exit 0)
        run: |
          docker stop --time 60 api worker
          for c in api worker; do
            codigo=$(docker inspect --format '{{.State.ExitCode}}' "$c")
            echo "$c saiu com $codigo"
            test "$codigo" = 0
          done
      - name: Tamanho das imagens (resumo do run)
        run: |
          {
            echo '### Imagens de produção (linux/arm64)'
            echo
            echo '| Imagem | Tamanho |'
            echo '| --- | --- |'
            docker image ls --filter 'reference=sussurro-*:ci' --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs dos containers (só em falha)
        if: failure()
        run: |
          for c in api worker; do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 || true
            echo "::endgroup::"
          done
          docker compose logs --no-color || true

  # Fase 4e (ADR 0013): a parte nativa do Android, que nenhum outro job compila. Prebuild (CNG) da
  # variante de produção, testes de JVM do módulo NFC (NFC-10 a 17, SussurroNfcProtocolTest) e o
  # manifesto final de release, conferido pela lista de permitidas do
  # scripts/check-android-manifest.mjs (a mesma da tabela do docs/deploy/lojas.md). Aqui o Gradle baixa as dependências do Maven, o que a
  # máquina de desenvolvimento não faz. Sem assinatura, sem bundle JS e sem segredos: não gera AAB.
  # O Swift continua fora (precisaria de runner macOS; o binário sai pelo EAS).
  native:
    name: native (Kotlin NFC-10 a 17 e manifesto de release)
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.native != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # android/ é gerado (CNG, no .gitignore). Variante de produção: sem as exceções de rede do dev
      # build, como o AAB enviado às lojas.
      - name: Prebuild do Android (variante production)
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
        run: pnpm exec expo prebuild --platform android --no-install --clean
      # O gradle-wrapper.jar vem do template do prebuild: confere o checksum contra os publicados.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Depois do prebuild: o cache do Gradle é indexado pelos arquivos gerados.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
            apps/mobile/modules/*/android/build.gradle
      # processReleaseManifest: o manifesto final, depois do ajuste de maxSdkVersion do Expo
      # (expoReleaseOverrideMaxSdkConflicts). O processReleaseMainManifest é anterior a ele.
      - name: Testes Kotlin (NFC-10 a 17) e manifesto final de release
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :sussurro-proximity:testDebugUnitTest :app:processReleaseManifest
      - name: Permissões do manifesto final de release (lista de permitidas, lojas.md)
        run: >-
          node scripts/check-android-manifest.mjs
          apps/mobile/android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - name: Publica os relatórios e o manifesto (artefato android-native)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native
          path: |
            apps/mobile/modules/sussurro-proximity/android/build/reports/tests/
            apps/mobile/android/app/build/intermediates/merged_manifests/release/
            apps/mobile/android/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: audit (dependências de produção)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Lê o lockfile e o audit.ignore do pnpm-workspace.yaml (sem pnpm install). Só informa
      # (infra.md §4.1): um aviso novo não deixa o job vermelho.
      - name: pnpm audit (só informa)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      # B8: este passo, sim, deixa o job vermelho (inclusive no agendado): GHSA sem registro, caminho
      # fora da exceção ou data de revisão vencida (infra.md §8.3).
      - name: Exceções do audit (caminho registrado e data de revisão)
        run: node scripts/audit-exceptions.mjs
